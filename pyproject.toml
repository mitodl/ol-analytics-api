[project]
name = "ol-analytics-api"
version = "0.1.0"
description = "Read-only FastAPI service serving aggregated B2B site-license analytics to MIT Learn from StarRocks materialized views."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "aiomysql>=0.2.0",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cachetools>=5.5",
    "hvac>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "types-cachetools>=5.5",
    "types-hvac>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ol_analytics_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings not required project-wide
    "COM812",  # conflicts with ruff format
    "TC001",   # FastAPI needs response/dependency types available at runtime
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiomysql", "aiomysql.*"]
ignore_missing_imports = true
