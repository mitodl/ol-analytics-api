[project]
name = "ol-analytics-api"
version = "2026.7.22.1"
description = "Read-only FastAPI service serving aggregated B2B site-license analytics to MIT Learn from StarRocks materialized views."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "aiomysql>=0.2.0",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cachetools>=5.5",
    "hvac>=2.3",
    "structlog>=24.0.0",
    "sentry-sdk[fastapi]>=2.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "opentelemetry-exporter-otlp-proto-http>=1.31.0",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-instrumentation-httpx>=0.52b0",
    "granian[reload,uvloop]>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "types-cachetools>=5.5",
    "types-hvac>=2.3",
    "asgi-lifespan>=2.1.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ol_analytics_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ol_analytics_api"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings not required project-wide
    "COM812",  # conflicts with ruff format
    "TC001",   # FastAPI needs response/dependency types available at runtime
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "PLR2004"]
# structlog's processor signature is conventionally (logger: Any, method_name: str,
# event_dict: dict) — matches mitol-django-observability's own typing, ported verbatim.
"src/ol_analytics_api/core/observability/processors.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiomysql", "aiomysql.*"]
ignore_missing_imports = true

[tool.bumpversion]
current_version = "2026.7.22.1"
commit = false
tag = false
parse = "(?P<release>(?:[1-9][0-9]{3})\\.(?:1[0-2]|[1-9])\\.(?:3[0-1]|[12][0-9]|[1-9]))\\.(?P<build>\\d+)"
serialize = ["{release}.{build}"]

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{MM}.{DD}"

[tool.bumpversion.parts.build]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "ol-analytics-api"
version = "{current_version}"
source = {{ editable = "." }}"""
replace = """
name = "ol-analytics-api"
version = "{new_version}"
source = {{ editable = "." }}"""
