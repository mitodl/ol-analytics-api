[project]
name = "ol-analytics-api"
version = "2026.7.22.1"
description = "Read-only FastAPI service serving aggregated B2B site-license analytics to MIT Learn from StarRocks materialized views."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "aiomysql>=0.2.0",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cachetools>=5.5",
    "hvac>=2.3",
    "structlog>=24.0.0",
    "sentry-sdk[fastapi]>=2.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "opentelemetry-exporter-otlp-proto-http>=1.31.0",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-instrumentation-httpx>=0.52b0",
    "granian[reload,uvloop]>=2.7",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7d"

[tool.uv.exclude-newer-package]
ol-concourse = "0d"
django-aqueduct = "0d"
edx-sysadmin = "0d"
edx-username-changer = "0d"
ol-openedx-ai-static-translations = "0d"
ol-openedx-auto-select-language = "0d"
ol-openedx-canvas-integration = "0d"
ol-openedx-chat = "0d"
ol-openedx-chat-xblock = "0d"
ol-openedx-checkout-external = "0d"
ol-openedx-course-export = "0d"
ol-openedx-course-outline-api = "0d"
ol-openedx-course-structure-api = "0d"
ol-openedx-course-sync = "0d"
ol-openedx-course-translations = "0d"
ol-openedx-events-handler = "0d"
ol-openedx-feedback = "0d"
ol-openedx-git-auto-export = "0d"
ol-openedx-logging = "0d"
ol-openedx-lti-utilities = "0d"
ol-openedx-otel-monitoring = "0d"
ol-openedx-rapid-response-reports = "0d"
ol-openedx-sentry = "0d"
ol-openedx-uai-content-customization = "0d"
ol-social-auth = "0d"
openedx-companion-auth = "0d"
rapid-response-xblock = "0d"
mitol-django-common = "0d"
mitol-django-mail = "0d"
mitol-django-authentication = "0d"
mitol-django-digitalcredentials = "0d"
mitol-django-geoip = "0d"
mitol-django-google-sheets = "0d"
mitol-django-google-sheets-deferrals = "0d"
mitol-django-google-sheets-refunds = "0d"
mitol-django-hubspot-api = "0d"
mitol-django-oauth-toolkit-extensions = "0d"
mitol-django-olposthog = "0d"
mitol-django-openedx = "0d"
mitol-django-payment-gateway = "0d"
mitol-django-transcoding = "0d"
mitol-django-apigateway = "0d"
mitol-django-observability = "0d"
mitol-django-scim = "0d"
mitol-drf-lint = "0d"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "types-cachetools>=5.5",
    "types-hvac>=2.3",
    "asgi-lifespan>=2.1.0",
    "pytest-cov>=7.1.0",
    "cyclopts>=4.22.5",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ol_analytics_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ol_analytics_api"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
# bin/ scripts are extensionless with a shebang, matching the bin/starrocks-auth
# convention. Ruff discovers *.py only, so `ruff check .` would skip them.
extend-include = ["bin/*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings not required project-wide
    "COM812",  # conflicts with ruff format
    "TC001",   # FastAPI needs response/dependency types available at runtime
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
# S105-S107: fixture values named `token` are fake OAuth2 tokens for the
# MITx Online client tests, not real credentials.
"tests/*" = ["S101", "ANN", "PLR2004", "S105", "S106", "S107"]
# structlog's processor signature is conventionally (logger: Any, method_name: str,
# event_dict: dict) — matches mitol-django-observability's own typing, ported verbatim.
"src/ol_analytics_api/core/observability/processors.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiomysql", "aiomysql.*"]
ignore_missing_imports = true

[tool.bumpversion]
current_version = "2026.7.22.1"
commit = false
tag = false
parse = "(?P<release>(?:[1-9][0-9]{3})\\.(?:1[0-2]|[1-9])\\.(?:3[0-1]|[12][0-9]|[1-9]))\\.(?P<build>\\d+)"
serialize = ["{release}.{build}"]

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{MM}.{DD}"

[tool.bumpversion.parts.build]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "ol-analytics-api"
version = "{current_version}"
source = {{ editable = "." }}"""
replace = """
name = "ol-analytics-api"
version = "{new_version}"
source = {{ editable = "." }}"""
