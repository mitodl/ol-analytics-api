name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub silently drops a `pull_request` event when it cannot compute the PR's
  # merge commit at push time -- e.g. when the base branch moved moments earlier
  # and `refs/pull/N/merge` is still being recomputed. No run is created and none
  # is retried, so the commit sits on the PR with no `test` check at all. Pass the
  # PR number here to re-run against the same merge ref the dropped run would have
  # used; leave it blank to test a branch as-is.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test via its merge commit (blank = this branch as-is)"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # tests/test_openapi_spec.py already asserts the spec is current. This
      # step is here for the other half: nothing else runs the generator
      # itself, and a build-time script that only ever runs by hand is one
      # that breaks unnoticed and is discovered when someone needs it.
      - run: uv run bin/generate-openapi-spec --check
      - run: uv run pytest --cov=ol_analytics_api --cov-report=term-missing
