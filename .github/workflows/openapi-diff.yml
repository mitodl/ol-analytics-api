name: OpenAPI Diff

# The committed spec is meant to be what a future Concourse client pipeline
# generates a published TypeScript package from (see README.md), so a diff
# here is a preview of a change to somebody else's build. This surfaces that
# change as a comment and fails the PR on a breaking one, rather than leaving
# it to whoever reads 1500 lines of YAML.
#
# An intended breaking change passes only when the PR both carries the
# `breaking-api-change` label and adds a changelog.d/ fragment recording the
# break (see "Breaking changes" in README.md). Without that path the only way
# past this check was an admin merge, which skips every check and records
# nothing about why.

on:
  pull_request:
    # labeled/unlabeled so that adding or removing the label re-evaluates the
    # check without a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "openapi/specs/**"

permissions: {}

# Label events can land while a push's run is still going. Only the newest run
# should decide the check.
concurrency:
  group: openapi-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  openapi-diff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit under review, not the branch name: a push while
          # this runs would otherwise diff a commit nobody reviewed.
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Checkout BASE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Generate oasdiff changelog
        run: | # Write the comment body to a file rather than a step output.
          # A large changelog interpolated into a JS action's `body:` input becomes a
          # huge INPUT_BODY env var, which can blow past the OS argv+envp size limit
          # and crash the action with "Argument list too long". Writing straight to a
          # file and using `body-path` avoids that entirely.
          #
          # The spec list is the union of base and head filenames, not just base's:
          # a base-only loop silently drops both a spec added in this PR (never in
          # base, so never iterated) and a spec removed in this PR (caught by the
          # -f guard below, so skipped instead of reported as a removal).
          specs=$(
            {
              [ -d base/openapi/specs ] && (cd base/openapi/specs && ls -1 ./*.yaml)
              [ -d head/openapi/specs ] && (cd head/openapi/specs && ls -1 ./*.yaml)
            } 2>/dev/null | xargs -n1 basename | sort -u
          )
          {
            echo "## OpenAPI Changes"
            echo ""
            echo "<details>"
            echo "<summary>Show/hide changes</summary>"
            echo ""
            echo '```'
            for name in $specs; do
              base_spec="base/openapi/specs/$name"
              head_spec="head/openapi/specs/$name"
              if [ -f "$base_spec" ] && [ -f "$head_spec" ]; then
                echo "## Changes for $name:"
                docker run --rm \
                  --workdir "$GITHUB_WORKSPACE" \
                  --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
                  tufin/oasdiff@sha256:6065c16a4c9ce12504752f444d4981091e58c2a35436fac90b649be47d833db3 \
                  changelog "$base_spec" "$head_spec"
                echo ""
              elif [ -f "$head_spec" ]; then
                echo "## $name: added"
                echo ""
              elif [ -f "$base_spec" ]; then
                echo "## $name: removed"
                echo ""
              fi
            done
            echo '```'
            echo ""
            echo "Unexpected changes? Ensure your branch is up-to-date with \`main\` (consider rebasing)."
            echo "</details>"
          } > comment_body.md
      # A fork's GITHUB_TOKEN is read-only whatever this job asks for, so both
      # comment steps would fail and take the breaking-change check below down
      # with them. The check is the gate; the comment is a convenience. Skip
      # the convenience rather than lose the gate.
      - name: Find existing comment
        id: find_comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "## OpenAPI Changes"
      - name: Post changes as comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        # Even with no changes, update the old comment if one was found.
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          edit-mode: "replace"
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body-path: comment_body.md
      - name: Check for breaking changes
        id: breaking
        run: |
          # Breaking here means breaking a client someone else already
          # generated and shipped, so this fails the PR rather than warning.
          # A spec removed outright is the most breaking change there is,
          # deleting the whole published API for a tenant, so it's checked
          # explicitly rather than relying on the -f guard to skip it, and the
          # accepted-break path below does not cover it.
          #
          # oasdiff exits 1 when it finds a breaking change and 102 when it
          # cannot load a spec. Only exit 1 is recorded for the accepted-break
          # step; any other failure fails here.
          specs=$(
            {
              [ -d base/openapi/specs ] && (cd base/openapi/specs && ls -1 ./*.yaml)
              [ -d head/openapi/specs ] && (cd head/openapi/specs && ls -1 ./*.yaml)
            } 2>/dev/null | xargs -n1 basename | sort -u
          )
          breaking=false
          for name in $specs; do
            base_spec="base/openapi/specs/$name"
            head_spec="head/openapi/specs/$name"
            if [ -f "$base_spec" ] && [ -f "$head_spec" ]; then
              echo "Checking $name for breaking changes..."
              status=0
              docker run --rm \
                --workdir "$GITHUB_WORKSPACE" \
                --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
                tufin/oasdiff@sha256:6065c16a4c9ce12504752f444d4981091e58c2a35436fac90b649be47d833db3 \
                breaking \
                --fail-on ERR \
                --format githubactions \
                "$base_spec" "$head_spec" || status=$?
              case "$status" in
                0) ;;
                1) breaking=true ;;
                *) echo "::error::oasdiff exited $status on $name."; exit "$status" ;;
              esac
            elif [ -f "$base_spec" ]; then
              echo "::error::$name was removed. Deleting a published spec is a breaking change."
              exit 1
            fi
          done
          echo "breaking=$breaking" >> "$GITHUB_OUTPUT"
      - name: Require an accepted breaking change
        if: steps.breaking.outputs.breaking == 'true'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Labels and files come from the API rather than the event payload:
          # a re-run replays the original payload, so a label added since
          # would otherwise be missed. The files list is the PR's own diff
          # against its merge base, so a fragment main already carries does
          # not count.
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          LABEL = "breaking-api-change"
          FRAGMENT_PATH = re.compile(r"changelog\.d/[\w.-]+\.md")
          CATEGORY_HEADER = re.compile(r"#+\s+(\w+)\s*")
          # scriv's template ships every category inside an HTML comment.
          COMMENT = re.compile(r"<!--.*?-->", re.DOTALL)
          MARKER = "Breaking:"

          pr = f"repos/{os.environ['REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}"


          def gh_api(path: str) -> list:
              out = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", path],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              return json.loads(out)


          labels = {label["name"] for label in gh_api(pr)[0]["labels"]}
          added = [
              f["filename"]
              for page in gh_api(f"{pr}/files")
              for f in page
              if f["status"] == "added" and FRAGMENT_PATH.fullmatch(f["filename"])
          ]


          def records_break(path: str) -> bool:
              category = None
              text = COMMENT.sub("", (Path("head") / path).read_text())
              for line in text.splitlines():
                  header = CATEGORY_HEADER.fullmatch(line)
                  if header:
                      category = header.group(1)
                  elif category in {"Removed", "Changed"} and MARKER in line:
                      return True
              return False


          fragments = [path for path in added if records_break(path)]

          missing = []
          if LABEL not in labels:
              missing.append(f"the `{LABEL}` label")
          if not fragments:
              missing.append(
                  "a new changelog.d/ fragment with a Removed or Changed entry"
                  f" containing `{MARKER}`"
              )
          if missing:
              print(
                  "::error::Breaking API change. If it is intended, the PR needs "
                  + " and ".join(missing)
                  + ". See \"Breaking changes\" in README.md."
              )
              sys.exit(1)

          print(
              f"::notice::Accepted breaking API change: label `{LABEL}`,"
              f" fragment {', '.join(fragments)}."
          )
