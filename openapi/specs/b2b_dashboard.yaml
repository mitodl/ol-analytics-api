    MonthlyEngagementTrend:
      properties:
        organization_key:
          type: string
          title: Organization Key
          description: Internal identifier for the organization.
        organization_name:
          type: string
          title: Organization Name
          description: The organization's name.
        activity_year_and_month:
          type: string
          title: Activity Year And Month
          description: The month, e.g. 2026-08.
        monthly_active_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Monthly Active Learners
          description: 'Learners who did course work this month: watched a video,
            attempted a problem, posted in a discussion, used the chatbot or moved
            through course pages. Enrolling or earning a certificate alone doesn''t
            count. Withheld when too few learners are in the group to report without
            identifying them.'
        new_enrollments:
          anyOf:
          - type: integer
          - type: 'null'
          title: New Enrollments
          description: Course enrollments made this month. A learner who enrolled
            in six courses counts six times. Withheld when the learner count it is
            based on is withheld.
        enrolling_learners:
          anyOf:
          - type: integer
          - type: 'null'
