      properties:
        organization_key:
          type: string
          title: Organization Key
          description: Internal identifier for the organization.
        organization_name:
          type: string
          title: Organization Name
          description: The organization's name.
        contract_pk:
          type: string
          title: Contract Pk
          description: Internal identifier for the contract.
        contract_id:
          type: integer
          title: Contract Id
          description: The contract's ID in MITx Online.
        b2b_contract_name:
          type: string
          title: B2B Contract Name
          description: The contract's name.
        program_pk:
          type: string
          title: Program Pk
          description: Internal identifier for the program.
        program_title:
          type: string
          title: Program Title
          description: The program's title.
        total_courses:
          type: integer
          title: Total Courses
          description: Courses in the program that the contract covers.
        enrolled_in_contract_courses:
          type: integer
          title: Enrolled In Contract Courses
          description: Learners enrolled in at least one of the program's courses
            under the contract. When too few learners are in the group, the whole
            row is withheld to avoid identifying them.
        enrolled_via_program:
          anyOf:
          - type: integer
          - type: 'null'
          title: Enrolled Via Program
          description: Of those learners, how many enrolled in the program itself
            rather than directly in one of its courses. Withheld when too few learners
            are in the group to report without identifying them.
        program_course_completers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Program Course Completers
          description: Learners who earned a certificate in at least one of the program's
            courses under the contract. This isn't the same as completing the whole
            program. Withheld when too few learners are in the group to report without
            identifying them.
      type: object
      required:
      - organization_key
      - organization_name
      - contract_pk
      - contract_id
      - b2b_contract_name
      - program_pk
      - program_title
      - total_courses
      - enrolled_in_contract_courses
      - enrolled_via_program
      - program_course_completers
      title: ProgramFunnel
      description: 'mv_b2b_program_funnel — grain: org x contract x program.


        ``total_courses`` counts courses, not learners, so it is not a cohort.


        ``program_course_completers`` approximates program completion: it counts a

        non-revoked certificate in any contract-covered course of the program, not

        a program-level certificate, pending a program-certificate fact table.'
