openapi: 3.1.0
info:
  title: B2B Analytics Dashboard
  description: B2B site-license analytics for org managers and MIT contract admins.
    Aggregate endpoints apply a k-anonymity floor. The contract-scoped learner-progress
    endpoint returns individual learners on the organization's own seats, with outcome
    fields consent-gated.
  version: 0.0.1
