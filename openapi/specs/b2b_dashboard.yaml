      - b2b_contract_is_active
      - b2b_contract_start_date
      - b2b_contract_end_date
      - seat_limit
      - b2b_contract_membership_type
      - seats_consumed
      - active_learners
      - learners_certified
      - seat_utilization_pct
      - completion_rate_pct
      title: ContractUtilization
      description: 'mv_b2b_contract_utilization — grain: org x contract.


        ``seats_consumed`` is the primary cohort. ``active_learners`` and

        ``learners_certified`` are secondary counts, nulled when nonzero but below

        the floor. ``completion_rate_pct`` is ``learners_certified`` over

