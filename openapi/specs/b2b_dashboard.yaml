components:
  schemas:
    AdminAnalyticsResponse_MitAdminContractHealth_:
      properties:
        as_of:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
        total_count:
          type: integer
          title: Total Count
        data:
          items:
            $ref: '#/components/schemas/MitAdminContractHealth'
          type: array
          title: Data
      type: object
      required:
      - as_of
      - total_count
      - data
      title: AdminAnalyticsResponse[MitAdminContractHealth]
    CompletionStatus:
      type: string
      enum:
      - not_started
      - in_progress
      - passed
      - certified
      title: CompletionStatus
      description: '``passed`` without ``certified`` is normal: certificates are issued
        on a

        schedule after grading, and audit-mode enrollments never certify.'
    CompletionStatusCounts:
      properties:
        certified:
          type: integer
          title: Certified
          description: Matching enrollments with an unrevoked certificate, whatever
            their grade.
        passed:
          type: integer
          title: Passed
          description: Matching enrollments with a currently passing grade, other
            than those already counted as certified above.
        in_progress:
          type: integer
          title: In Progress
          description: Matching enrollments with a nonzero grade so far that isn't
            yet passing, other than those already counted as certified or passed above.
        not_started:
          type: integer
          title: Not Started
          description: Matching enrollments with no certificate and no grade recorded
            yet.
      type: object
      required:
      - certified
      - passed
      - in_progress
      - not_started
      title: CompletionStatusCounts
      description: 'Matches ``LearnerProgressResponse.total_count``''s own filters,
        not the

        contract as a whole, so it narrows along with the table it summarizes.


        Each field counts a disjoint slice of the matching enrollments: every

        enrollment falls into exactly one, in the order below (certificate beats

        grade beats no grade), so summing the four plus ``outcomes_withheld_count``

        always equals ``total_count``. An unrevoked certificate always wins even

        when the same enrollment also carries a passing or in-progress grade,

        which is why each field''s own description calls out what it excludes.'
    CompletionStatusFilter:
      type: string
      enum:
      - not_started
      - in_progress
      - passed
      - certified
      - unknown
      title: CompletionStatusFilter
    ContentEngagementDepth:
      properties:
        organization_key:
          type: string
          title: Organization Key
          description: Internal identifier for the organization.
        organization_name:
          type: string
          title: Organization Name
          description: The organization's name.
        courserun_readable_id:
          type: string
          title: Courserun Readable Id
          description: The course run's ID, e.g. course-v1:MITxT+14.310x+2T2026.
        courserun_title:
          type: string
          title: Courserun Title
          description: The course's title.
        total_enrolled_learners:
          type: integer
          title: Total Enrolled Learners
          description: Learners who have ever enrolled in this course run. When too
            few learners are in the group, the whole row is withheld to avoid identifying
            them.
        engaged_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Engaged Learners
          description: 'Enrolled learners who did anything in the course: watched
            a video, attempted a problem, posted in a discussion, used the chatbot,
            moved through course pages or earned a certificate. Withheld when too
            few learners are in the group to report without identifying them.'
        engagement_rate_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Engagement Rate Pct
          description: Percentage of enrolled learners who did anything in the course.
            Withheld when the learner count it is based on is withheld.
        total_videos_watched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Videos Watched
          description: Videos watched in this course run, counting every view. Withheld
            when the learner count it is based on is withheld.
        video_watchers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Watchers
          description: Learners who watched at least one video in this course run.
            Withheld when too few learners are in the group to report without identifying
            them.
        avg_videos_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Videos Per Engaged Learner
          description: Average videos watched per learner who did anything in the
            course. Withheld when the learner count it is based on is withheld.
        total_problems_attempted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Problems Attempted
          description: Problem attempts in this course run, counting every attempt.
            Withheld when the learner count it is based on is withheld.
        problem_attempters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Attempters
          description: Learners who attempted at least one problem in this course
            run. Withheld when too few learners are in the group to report without
            identifying them.
        avg_problems_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Problems Per Engaged Learner
          description: Average problem attempts per learner who did anything in the
            course. Withheld when the learner count it is based on is withheld.
        total_chatbot_interactions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Chatbot Interactions
          description: Chatbot interactions in this course run. Withheld when the
            learner count it is based on is withheld.
        chatbot_users:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chatbot Users
          description: Learners who used the chatbot in this course run. Withheld
            when too few learners are in the group to report without identifying them.
        chatbot_adoption_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Chatbot Adoption Pct
          description: Percentage of enrolled learners who used the chatbot. Withheld
            when the learner count it is based on is withheld.
        certificates_earned:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certificates Earned
          description: Certificates earned in this course run. Withheld when too few
            learners are in the group to report without identifying them.
      type: object
      required:
      - organization_key
      - organization_name
      - courserun_readable_id
      - courserun_title
      - total_enrolled_learners
      - engaged_learners
      - engagement_rate_pct
      - total_videos_watched
      - video_watchers
      - avg_videos_per_engaged_learner
      - total_problems_attempted
      - problem_attempters
      - avg_problems_per_engaged_learner
      - total_chatbot_interactions
      - chatbot_users
      - chatbot_adoption_pct
      - certificates_earned
      title: ContentEngagementDepth
      description: 'mv_b2b_content_engagement_depth — grain: org x course_run (all-time).


        The chatbot columns are exact: ``total_chatbot_interactions`` sums over,

        and ``chatbot_adoption_pct`` divides by, ``chatbot_users`` — which this

        view does emit, so both are correctly floored. ``engagement_rate_pct`` is

        ``engaged_learners / total_enrolled_learners``, also correct.


        The video and problem columns are floored through the cohorts the view now

        publishes (ol-data-platform PR #2520): ``total_videos_watched`` is summed

        over ``video_watchers`` and ``total_problems_attempted`` over

        ``problem_attempters``, each a strict subset of ``engaged_learners``

        because watching a video or attempting a problem is one of the activities

        that sets ``active_count``. (Every cohort this view emits is such a

        subset. That is a property of these particular cohorts, not a general

        rule — see ``MonthlyEngagementTrend``, where ``enrolling_learners`` is

        not a subset of its primary because enrolling does not set

        ``active_count``.)


        The ``avg_*_per_engaged_learner`` columns are derived from *two* cohorts,

        which is why each names both. The denominator is ``engaged_learners`` —

        that is what the dbt SQL divides by, so the naming is now accurate — but

        the numerator is the activity SUM, contributed by only the narrower

        cohort. Mapping the average to its denominator alone would leave the

        numerator recoverable: an unsuppressed average multiplied by a published

        ``engaged_learners`` yields the suppressed total exactly, and when the

        contributing cohort is a single learner that total *is* that learner''s

        value. Naming both cohorts nulls the average whenever either is sub-floor.


        ``certificates_earned`` is the one column still floored as a count of

        itself: it is ``sum(certificate_count)``, an event count, and this view

        emits no certified-learner cohort to attribute it to (unlike

        ``MonthlyEngagementTrend``, which has ``certified_learners``). Flooring an

        event count is weaker than flooring a cohort — several certificates can

        come from one learner — but strictly better than not flooring it. Emitting

        the cohort from dbt would close this the same way #2520 closed the others.'
    ContractContentEngagementDepth:
      properties:
        organization_key:
          type: string
          title: Organization Key
          description: Internal identifier for the organization.
        organization_name:
          type: string
          title: Organization Name
          description: The organization's name.
        courserun_readable_id:
          type: string
          title: Courserun Readable Id
          description: The course run's ID, e.g. course-v1:MITxT+14.310x+2T2026.
        courserun_title:
          type: string
          title: Courserun Title
          description: The course's title.
        total_enrolled_learners:
          type: integer
          title: Total Enrolled Learners
          description: Learners who have ever enrolled in this course run. When too
            few learners are in the group, the whole row is withheld to avoid identifying
            them.
        engaged_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Engaged Learners
          description: 'Enrolled learners who did anything in the course: watched
            a video, attempted a problem, posted in a discussion, used the chatbot,
            moved through course pages or earned a certificate. Withheld when too
            few learners are in the group to report without identifying them.'
        engagement_rate_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Engagement Rate Pct
          description: Percentage of enrolled learners who did anything in the course.
            Withheld when the learner count it is based on is withheld.
        total_videos_watched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Videos Watched
          description: Videos watched in this course run, counting every view. Withheld
            when the learner count it is based on is withheld.
        video_watchers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Watchers
          description: Learners who watched at least one video in this course run.
            Withheld when too few learners are in the group to report without identifying
            them.
        avg_videos_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Videos Per Engaged Learner
          description: Average videos watched per learner who did anything in the
            course. Withheld when the learner count it is based on is withheld.
        total_problems_attempted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Problems Attempted
          description: Problem attempts in this course run, counting every attempt.
            Withheld when the learner count it is based on is withheld.
        problem_attempters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Attempters
          description: Learners who attempted at least one problem in this course
            run. Withheld when too few learners are in the group to report without
            identifying them.
        avg_problems_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Problems Per Engaged Learner
          description: Average problem attempts per learner who did anything in the
            course. Withheld when the learner count it is based on is withheld.
