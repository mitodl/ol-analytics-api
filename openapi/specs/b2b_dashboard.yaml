  /api/v1/analytics/organizations/{organization_id}/contracts/{contract_id}/learner-progress:
    get:
      tags:
      - learners
      summary: Each learner's enrollment and completion in each course run under the
        contract
      operationId: learners_progress_retrieve
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      - name: contract_id
        in: path
        required: true
        schema:
          type: integer
          title: Contract Id
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 254
          - type: 'null'
          description: Case-insensitive match on email or name.
          title: Search
        description: Case-insensitive match on email or name.
      - name: completion_status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CompletionStatusFilter'
          description: Repeat for several. `unknown` selects rows with withheld outcomes.
          title: Completion Status
        description: Repeat for several. `unknown` selects rows with withheld outcomes.
      - name: courserun_readable_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Exact match. Narrows to one course run, e.g. the module filter.
          title: Courserun Readable Id
        description: Exact match. Narrows to one course run, e.g. the module filter.
      - name: needs_attention
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Keep only the learners who need attention, or only those who
            don't. Cuts the same rows `needs_attention_count` counts. Rows with withheld
            outcomes match neither, so omit this to see them.
          title: Needs Attention
        description: Keep only the learners who need attention, or only those who
          don't. Cuts the same rows `needs_attention_count` counts. Rows with withheld
          outcomes match neither, so omit this to see them.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          description: Include deactivated enrollments (unenrolled, refunded).
          default: false
          title: Include Inactive
        description: Include deactivated enrollments (unenrolled, refunded).
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortKey'
          default: full_name
      - name: descending
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Descending
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProgressResponse'
        '422':
          description: Validation Error
          content:
