components:
  schemas:
    AdminAnalyticsResponse_MitAdminContractHealth_:
      properties:
        as_of:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
        total_count:
          type: integer
          title: Total Count
        data:
          items:
            $ref: '#/components/schemas/MitAdminContractHealth'
          type: array
          title: Data
      type: object
      required:
      - as_of
      - total_count
      - data
      title: AdminAnalyticsResponse[MitAdminContractHealth]
    ContentEngagementDepth:
      properties:
        organization_key:
          type: string
          title: Organization Key
        organization_name:
          type: string
          title: Organization Name
        courserun_readable_id:
          type: string
          title: Courserun Readable Id
        courserun_title:
          type: string
          title: Courserun Title
        total_enrolled_learners:
          type: integer
          title: Total Enrolled Learners
        engaged_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Engaged Learners
        engagement_rate_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Engagement Rate Pct
        total_videos_watched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Videos Watched
        video_watchers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Watchers
        avg_videos_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Videos Per Engaged Learner
        total_problems_attempted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Problems Attempted
        problem_attempters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Attempters
        avg_problems_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Problems Per Engaged Learner
        total_chatbot_interactions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Chatbot Interactions
        chatbot_users:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chatbot Users
        chatbot_adoption_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Chatbot Adoption Pct
        certificates_earned:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certificates Earned
      type: object
      required:
      - organization_key
      - organization_name
      - courserun_readable_id
      - courserun_title
      - total_enrolled_learners
      - engaged_learners
      - engagement_rate_pct
      - total_videos_watched
      - video_watchers
      - avg_videos_per_engaged_learner
      - total_problems_attempted
      - problem_attempters
      - avg_problems_per_engaged_learner
      - total_chatbot_interactions
      - chatbot_users
      - chatbot_adoption_pct
      - certificates_earned
      title: ContentEngagementDepth
      description: 'mv_b2b_content_engagement_depth — grain: org x course_run (all-time).


        The chatbot columns are exact: ``total_chatbot_interactions`` sums over,

        and ``chatbot_adoption_pct`` divides by, ``chatbot_users`` — which this

        view does emit, so both are correctly floored. ``engagement_rate_pct`` is

        ``engaged_learners / total_enrolled_learners``, also correct.


        The video and problem columns are floored through the cohorts the view now

        publishes (ol-data-platform PR #2520): ``total_videos_watched`` is summed

        over ``video_watchers`` and ``total_problems_attempted`` over

        ``problem_attempters``, each a strict subset of ``engaged_learners``

        because watching a video or attempting a problem is one of the activities

        that sets ``active_count``. (Every cohort this view emits is such a

        subset. That is a property of these particular cohorts, not a general

        rule — see ``MonthlyEngagementTrend``, where ``enrolling_learners`` is

        not a subset of its primary because enrolling does not set

        ``active_count``.)


        The ``avg_*_per_engaged_learner`` columns are derived from *two* cohorts,

        which is why each names both. The denominator is ``engaged_learners`` —

        that is what the dbt SQL divides by, so the naming is now accurate — but

        the numerator is the activity SUM, contributed by only the narrower

        cohort. Mapping the average to its denominator alone would leave the

        numerator recoverable: an unsuppressed average multiplied by a published

        ``engaged_learners`` yields the suppressed total exactly, and when the

        contributing cohort is a single learner that total *is* that learner''s

        value. Naming both cohorts nulls the average whenever either is sub-floor.


        ``certificates_earned`` is the one column still floored as a count of

        itself: it is ``sum(certificate_count)``, an event count, and this view

        emits no certified-learner cohort to attribute it to (unlike

        ``MonthlyEngagementTrend``, which has ``certified_learners``). Flooring an

        event count is weaker than flooring a cohort — several certificates can

        come from one learner — but strictly better than not flooring it. Emitting

        the cohort from dbt would close this the same way #2520 closed the others.'
    ContractContentEngagementDepth:
      properties:
        organization_key:
          type: string
          title: Organization Key
        organization_name:
          type: string
          title: Organization Name
        courserun_readable_id:
          type: string
          title: Courserun Readable Id
        courserun_title:
          type: string
          title: Courserun Title
        total_enrolled_learners:
          type: integer
          title: Total Enrolled Learners
        engaged_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Engaged Learners
        engagement_rate_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Engagement Rate Pct
        total_videos_watched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Videos Watched
        video_watchers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Watchers
        avg_videos_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Videos Per Engaged Learner
        total_problems_attempted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Problems Attempted
        problem_attempters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Attempters
        avg_problems_per_engaged_learner:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Problems Per Engaged Learner
        total_chatbot_interactions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Chatbot Interactions
        chatbot_users:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chatbot Users
        chatbot_adoption_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Chatbot Adoption Pct
        certificates_earned:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certificates Earned
        contract_pk:
          type: string
          title: Contract Pk
        contract_id:
          type: string
          title: Contract Id
        b2b_contract_name:
          type: string
          title: B2B Contract Name
      type: object
      required:
      - organization_key
      - organization_name
      - courserun_readable_id
      - courserun_title
      - total_enrolled_learners
      - engaged_learners
      - engagement_rate_pct
      - total_videos_watched
      - video_watchers
      - avg_videos_per_engaged_learner
      - total_problems_attempted
      - problem_attempters
      - avg_problems_per_engaged_learner
      - total_chatbot_interactions
      - chatbot_users
      - chatbot_adoption_pct
      - certificates_earned
      - contract_pk
      - contract_id
      - b2b_contract_name
      title: ContractContentEngagementDepth
      description: 'mv_b2b_contract_content_engagement_depth — grain: org x contract
        x run.


        The contract-scoped sibling of ``ContentEngagementDepth``, inherited for

        the same reason as ``ContractMonthlyEngagementTrend``.


        Unlike the trend view, these rows ARE a strict partition of the org-level

        view: a course run belongs to exactly one contract, so naming the contract

        labels a row rather than splitting it, and every count here equals its

        org-level counterpart for the same course run.


        That equality is why this pair needs no cross-grain guard, where the trend

        pair does. Nothing is aggregated away going from contract grain to org

        grain, so there is no remainder to subtract: a course run''s org row and its

        contract row hold the same numbers, the floor makes the same call on both,

        and a caller reading one learns nothing the other withholds.'
    ContractMonthlyEngagementTrend:
      properties:
        organization_key:
          type: string
          title: Organization Key
        organization_name:
          type: string
          title: Organization Name
        activity_year_and_month:
          type: string
          title: Activity Year And Month
        monthly_active_learners:
          type: integer
          title: Monthly Active Learners
        new_enrollments:
          anyOf:
          - type: integer
          - type: 'null'
          title: New Enrollments
        enrolling_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Enrolling Learners
        certificates_earned:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certificates Earned
        certified_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certified Learners
        total_videos_watched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Videos Watched
        video_watchers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Watchers
        total_problems_attempted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Problems Attempted
        problem_attempters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Attempters
        total_chatbot_interactions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Chatbot Interactions
        chatbot_users:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chatbot Users
        contract_pk:
          type: string
          title: Contract Pk
        contract_id:
          type: string
          title: Contract Id
        b2b_contract_name:
          type: string
          title: B2B Contract Name
      type: object
      required:
      - organization_key
      - organization_name
      - activity_year_and_month
      - monthly_active_learners
      - new_enrollments
      - enrolling_learners
      - certificates_earned
      - certified_learners
      - total_videos_watched
      - video_watchers
      - total_problems_attempted
      - problem_attempters
      - total_chatbot_interactions
      - chatbot_users
      - contract_pk
      - contract_id
      - b2b_contract_name
      title: ContractMonthlyEngagementTrend
      description: 'mv_b2b_contract_monthly_engagement_trend — grain: org x contract
        x month.


        The contract-scoped sibling of ``MonthlyEngagementTrend``, backing the

        endpoints nested under a contract. Subclassed rather than redeclared so the

        two can''t drift: the column set and the ``cohort_policy`` — which is what

        the anonymization floor reads — are inherited verbatim, and only contract

        identity is added. The dbt models are siblings in the same way.


        The contract columns are not cohorts and take no part in the policy.


        A learner active under two of an org''s contracts appears in both rows, so

        these rows do not partition the org-level view''s learner counts; summing

        ``monthly_active_learners`` across contracts can exceed the org''s own

        figure. Activity totals, being sums of events, do add up — which is what

        makes a contract-month the floor withholds recoverable from the org

        endpoint as ``org_total - sum(the visible contract months)``. The org

        endpoint defends against that itself: it probes this view for the months

        it withholds and blanks its own additive totals for them (see

        ``routers.organizations._FinerGrain``). The learner counts are left alone,

        because not adding up is exactly what stops them from being recovered by

        subtraction.'
    ContractUtilization:
      properties:
        organization_key:
          type: string
          title: Organization Key
        organization_name:
          type: string
          title: Organization Name
        contract_pk:
          type: string
          title: Contract Pk
        contract_id:
          type: string
          title: Contract Id
        b2b_contract_name:
          type: string
          title: B2B Contract Name
        b2b_contract_is_active:
          type: boolean
          title: B2B Contract Is Active
        b2b_contract_start_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: B2B Contract Start Date
        b2b_contract_end_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: B2B Contract End Date
        seat_limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seat Limit
        b2b_contract_membership_type:
          anyOf:
          - type: string
          - type: 'null'
          title: B2B Contract Membership Type
        seats_consumed:
          type: integer
          title: Seats Consumed
        active_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Learners
        learners_certified:
          anyOf:
          - type: integer
          - type: 'null'
          title: Learners Certified
        seat_utilization_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Seat Utilization Pct
        completion_rate_pct:
          anyOf:
