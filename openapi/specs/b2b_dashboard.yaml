            them.
        learners_certified:
          anyOf:
          - type: integer
          - type: 'null'
          title: Learners Certified
          description: Learners on the contract who earned a certificate that hasn't
            been revoked. Withheld when too few learners are in the group to report
            without identifying them.
        seat_utilization_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Seat Utilization Pct
          description: Percentage of the contract's seats in use. Empty when the contract
            has unlimited seats.
