    MonthlyEngagementTrend:
      properties:
        organization_key:
          type: string
          title: Organization Key
        organization_name:
          type: string
          title: Organization Name
        activity_year_and_month:
          type: string
          title: Activity Year And Month
        monthly_active_learners:
          type: integer
          title: Monthly Active Learners
        new_enrollments:
          anyOf:
          - type: integer
          - type: 'null'
          title: New Enrollments
        enrolling_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Enrolling Learners
        certificates_earned:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certificates Earned
        certified_learners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Certified Learners
        total_videos_watched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Videos Watched
        video_watchers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Watchers
        total_problems_attempted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Problems Attempted
        problem_attempters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Attempters
        total_chatbot_interactions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Chatbot Interactions
        chatbot_users:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chatbot Users
      type: object
      required:
      - organization_key
      - organization_name
      - activity_year_and_month
      - monthly_active_learners
      - new_enrollments
      - enrolling_learners
      - certificates_earned
      - certified_learners
      - total_videos_watched
      - video_watchers
      - total_problems_attempted
      - problem_attempters
      - total_chatbot_interactions
      - chatbot_users
      title: MonthlyEngagementTrend
      description: "mv_b2b_monthly_engagement_trend — grain: org x year_month.\n\n\
        Every aggregate here is floored through the cohort that contributes to it,\n\
        which the view publishes alongside it (ol-data-platform PR #2520).\n\nNone\
        \ of them is attributable to ``monthly_active_learners``. Each is a\nplain\
        \ SUM over the source report, so only the learners who did that\nspecific\
        \ thing contribute — and clearing the primary floor says nothing\nabout whether\
        \ that narrower cohort cleared it. A month with 40 active\nlearners can carry\
        \ a chatbot total contributed by exactly one of them,\nwhich is why each total\
        \ is ``derived`` from its own cohort rather than\nfrom the primary.\n\nHow\
        \ each cohort relates to the primary differs, and neither case makes\nmapping\
        \ to the primary safe:\n\n- ``certified_learners``, ``video_watchers``, ``problem_attempters``\
        \ and\n  ``chatbot_users`` are strict *subsets*. ``active_count`` is 1 when\
        \ any\n  of navigation, discussion, videos, problems, chatbot or certificate\n\
        \  activity is nonzero (organization_administration_report.sql), so each\n\
        \  of those actions sets it.\n- ``enrolling_learners`` is *not* a subset.\
        \ ``enrolled_count`` is absent\n  from that expression, so enrolling alone\
        \ never sets ``active_count``\n  and a learner who only enrolled is counted\
        \ here but not in the primary.\n  The row gate is unaffected — a month whose\
        \ primary is sub-floor is\n  dropped whole, which over-suppresses a large\
        \ enrollment cohort rather\n  than disclosing one — but the subset reasoning\
        \ does not apply, and\n  ``new_enrollments`` is floored through ``enrolling_learners``\
        \ on its\n  own terms.\n\n``new_enrollments`` and ``certificates_earned``\
        \ are SUMs of\nper-learner-per-course-run markers, so they count *events*,\
        \ not learners:\none learner enrolling in six runs reads as ``new_enrollments\
        \ == 6`` and\nwould clear a floor of 5 on its own. Flooring them directly\
        \ is therefore\nthe wrong instrument — they are ``derived`` from ``enrolling_learners``\n\
        and ``certified_learners``, the distinct-learner counts they are actually\n\
        attributable to, which do carry the floor."
