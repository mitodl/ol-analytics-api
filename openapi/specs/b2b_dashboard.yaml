      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      - name: contract_id
        in: path
        required: true
        schema:
          type: integer
          title: Contract Id
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 254
          - type: 'null'
          description: Case-insensitive match on email or name.
          title: Search
        description: Case-insensitive match on email or name.
      - name: completion_status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CompletionStatusFilter'
          description: Repeat for several. `unknown` selects rows with withheld outcomes.
          title: Completion Status
        description: Repeat for several. `unknown` selects rows with withheld outcomes.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          description: Include deactivated enrollments (unenrolled, refunded).
          default: false
          title: Include Inactive
        description: Include deactivated enrollments (unenrolled, refunded).
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortKey'
          default: full_name
      - name: descending
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Descending
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
