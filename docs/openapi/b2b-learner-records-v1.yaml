openapi: 3.1.0

info:
  title: MIT Open Learning — B2B Learner Records API
  version: 1.0.0-draft.2
  summary: >-
    Machine-to-machine, read-only, organization-scoped learner progress records
    for B2B site-license partners and their contracted training providers.
  description: |
    **DRAFT — proposed contract, not yet implemented.** Published so partners can
    review the record shape and size an integration. Field names and types may
    change before `1.0.0` final.

    Rationale, scope and open questions: `docs/b2b-learner-records-onepager.md`.

    Three things a reader needs that the schemas do not state:

    * **Consent gates outcomes, not identity.** Progress, completion and
      activity fields are populated only where the learner has opted in to
      sharing their course status. `outcomes_shared` says which. Identity and
      enrollment facts are not consent-gated — the organization assigned the
      seat. Until the upstream consent field ships, a learner with no
      recorded decision reads `outcomes_shared: false` where enforcement fails
      closed (the default) and `outcomes_shared: true` where the deployment
      fails open.
    * **The same schemas are delivered two ways.** This REST API, and a
      per-organization bulk export (S3/SFTP) written on each refresh. The export
      carries the same records under the same field names.
    * **`as_of` is the data's freshness and the sync cursor.** Records come from
      materialized views refreshed on a schedule. Pass a previous `as_of` as
      `updated_since` for incremental sync; a consent withdrawal arrives as a
      normal changed record with `outcomes_shared: false` and outcome fields
      nulled, which the client upserts to drop the data it held.

    Every property of the `Learner`, `Enrollment` and `CourseRun` record
    schemas carries `x-data-readiness`: `available` (backed today),
    `derived` (computable from existing sources), `pending-model` (needs
    upstream work; ships `null` until then).

  contact:
    name: MIT Open Learning — Data Engineering
    url: https://github.com/mitodl/ol-analytics-api
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause

servers:
  - url: https://api.mitxonline.mit.edu/api/v1/learner-records
    description: Production (planned)
  - url: https://api.qa.mitxonline.mit.edu/api/v1/learner-records
    description: QA — partner integration testing (planned)

security:
  - oauth2ClientCredentials:
      - learner-records:read

tags:
  - name: learners
  - name: enrollments
  - name: catalog
  - name: exports

paths:

  /organizations/{organization_id}/learners:
    get:
      tags: [learners]
      operationId: listLearners
      summary: Learner roster with progress rollups
      description: >-
        One row per learner associated with the organization, rolled up across
        all its contracts. With `contract_id`, returns learners holding that
        contract and recomputes every rollup from that contract's enrollments
        only. Ordered by `learner_id`, which is unique.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/LearnerId'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of learner records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Learner' }
              examples:
                default:
                  value:
                    organization_id: 8f14e45f-ceea-467a-9c1b-2f4b9c0a3d21
                    as_of: '2026-08-13T06:15:00Z'
                    total_count: 47
                    outcomes_withheld_count: 11
                    data:
                      - learner_id: 3e1a9c74-5b2d-4f88-9a01-7c6de2b4f019
                        email: rgarcia@contoso.example
                        full_name: R. Garcia
                        organization_id: 8f14e45f-ceea-467a-9c1b-2f4b9c0a3d21
                        organization_name: Contoso Manufacturing
                        membership_source: both
                        is_organization_manager: false
                        first_enrolled_on: '2026-02-03T14:22:11Z'
                        last_enrolled_on: '2026-05-19T09:04:52Z'
                        courses_enrolled: 4
                        outcomes_shared: true
                        outcomes_consent_on: '2026-02-03T14:20:04Z'
                        last_active_on: '2026-08-11'
                        courses_in_progress: 1
                        courses_passed: 3
                        courses_certified: 3
                        certificates_earned: 3
                      - learner_id: c04e8a17-3d62-4b95-a7e8-51fb2c8d9042
                        email: jlin@contoso.example
                        full_name: J. Lin
                        organization_id: 8f14e45f-ceea-467a-9c1b-2f4b9c0a3d21
                        organization_name: Contoso Manufacturing
                        membership_source: both
                        is_organization_manager: false
                        first_enrolled_on: '2026-03-11T10:02:44Z'
                        last_enrolled_on: '2026-03-11T10:02:44Z'
                        courses_enrolled: 2
                        outcomes_shared: false
                        outcomes_consent_on: null
                        last_active_on: null
                        courses_in_progress: null
                        courses_passed: null
                        courses_certified: null
                        certificates_earned: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /organizations/{organization_id}/enrollments:
    get:
      tags: [enrollments]
      operationId: listEnrollments
      summary: Learner-by-course-run enrollment and completion records
      description: >-
        One row per (learner, contract, course run) under the organization's
        contracts. Ordered by `(learner_id, contract_id, courserun_id)`, which
        is unique, so offset paging is stable.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CourseRunId'
        - $ref: '#/components/parameters/LearnerId'
        - $ref: '#/components/parameters/CompletionStatusFilter'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of enrollment records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Enrollment' }
              examples:
                default:
