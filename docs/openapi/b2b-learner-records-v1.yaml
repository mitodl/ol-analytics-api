  /organizations/{organization_id}/courses:
    get:
      tags: [catalog]
      operationId: listCourses
      summary: Contracts and course runs covered by the organization's licence
      description: >-
        Slow-changing and free of personal data. Cache it rather than joining
        per learner. Ordered by `(contract_id, courserun_id)`, which is unique.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of contract/course-run records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CourseRun' }
              examples:
                default:
