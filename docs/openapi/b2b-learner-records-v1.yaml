                        courserun_end_on: '2026-06-30T23:59:59Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /organizations/{organization_id}/exports:
    get:
      tags: [exports]
      operationId: listExports
      summary: Bulk export files available for this organization
      description: >-
        Manifest of the S3/SFTP bulk exports, one set per collection per
        refresh. Records inside carry the same schemas as this API, identity
        fields included. Ordered by `as_of` descending, then `collection` and
        `format`, which is unique.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of export manifest entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ExportFile' }
              examples:
                default:
                  value:
                    organization_id: 8f14e45f-ceea-467a-9c1b-2f4b9c0a3d21
                    as_of: '2026-08-13T06:15:00Z'
                    total_count: 3
                    outcomes_withheld_count: 0
                    data:
                      - collection: enrollments
                        as_of: '2026-08-13T06:15:00Z'
                        format: jsonl
                        record_count: 163
                        size_bytes: 214880
                        checksum_sha256: 9f2c1b7ae4d05c8831fbb2e6a0d47c3915ee8b6042d1f7c9a3b508e2d6417f0a
                        uri: s3://ol-b2b-exports/8f14e45f/2026-08-13T06-15-00Z/enrollments.jsonl.gz
                        expires_on: '2026-09-12T06:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:

  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: >-
        Keycloak client credentials, validated at the gateway. One client is
        issued per contracted integration and lists the organizations it may
        read. Scopes
        bound to a client are a contractual limit on that credential; they are
        not the consent mechanism.
      flows:
        clientCredentials:
          tokenUrl: https://sso.mit.edu/realms/olapps/protocol/openid-connect/token
          scopes:
            learner-records:read: Read records, identity fields included.

  parameters:

    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: The organization's Keycloak organization UUID. Slugs and names are not accepted.
      schema: { type: string, format: uuid }
      example: 8f14e45f-ceea-467a-9c1b-2f4b9c0a3d21

    ContractId:
      name: contract_id
      in: query
      required: false
      schema: { type: integer, format: int64 }
      example: 42

    CourseRunId:
      name: courserun_id
      in: query
      required: false
      schema: { type: string }
      example: course-v1:MITxT+14.310x+2T2026

    LearnerId:
      name: learner_id
      in: query
      required: false
      description: Repeat for several; maximum 100 per request.
      schema:
        type: array
        maxItems: 100
        items: { type: string, format: uuid }
      style: form
      explode: true

    CompletionStatusFilter:
      name: completion_status
      in: query
      required: false
      description: >-
        Repeat for several. Matches only records with shared outcomes; pass
        `unknown` to select records whose outcomes are withheld.
      schema:
        type: array
        items:
          type: string
          enum: [not_started, in_progress, passed, certified, unknown]
      style: form
      explode: true

    UpdatedSince:
      name: updated_since
      in: query
      required: false
      description: Return only records changed at or after this instant. Pass the previous sync's `as_of`.
      schema: { type: string, format: date-time }
      example: '2026-08-12T06:15:00Z'

    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: Include deactivated enrollments (unenrolled, refunded, transferred).
      schema: { type: boolean, default: false }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }

    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }

  schemas:

    OrganizationEnvelope:
      type: object
      description: Shared response envelope; `data` is typed per endpoint.
      required: [organization_id, as_of, total_count, outcomes_withheld_count, data]
      properties:
        organization_id:
          type: string
          format: uuid
        as_of:
          type: [string, 'null']
          format: date-time
          description: Last refresh of the backing data. Null before an organization's first refresh.
        total_count:
          type: integer
          minimum: 0
          description: Matching records across all pages, not this page.
        outcomes_withheld_count:
          type: integer
          minimum: 0
          description: >-
            Records in `total_count` carrying `outcomes_shared: false`. Always 0
            on `/courses` and `/exports`.
        data:
          type: array
          items: {}

    Learner:
      type: object
      description: >-
        One learner's association with the organization. Fields below
        `outcomes_shared` are null unless it is true.
      required:
        - learner_id
        - email
        - full_name
        - organization_id
        - organization_name
        - membership_source
        - is_organization_manager
        - first_enrolled_on
        - last_enrolled_on
        - courses_enrolled
        - outcomes_shared
        - outcomes_consent_on
        - last_active_on
        - courses_in_progress
        - courses_passed
        - courses_certified
        - certificates_earned
      properties:
        learner_id:
          type: string
          format: uuid
          description: Stable opaque identifier, consistent across endpoints and stable across email changes. Use as the join key.
          x-data-readiness: available
        email:
          type: [string, 'null']
          format: email
          description: Not a join key; may differ from the enrolling address.
          x-data-readiness: available
        full_name:
          type: [string, 'null']
          description: Often null.
          x-data-readiness: available
        organization_id:
          type: string
          format: uuid
          x-data-readiness: available
        organization_name:
          type: string
          x-data-readiness: available
        membership_source:
          $ref: '#/components/schemas/MembershipSource'
        is_organization_manager:
          type: boolean
          description: Administers the organization in MITx Online.
          x-data-readiness: available
        first_enrolled_on:
          type: [string, 'null']
          format: date-time
          description: Null for a roster member with no enrollments.
          x-data-readiness: available
        last_enrolled_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        courses_enrolled:
          type: integer
          minimum: 0
          description: Distinct course runs under the organization's contracts. Not consent-gated.
          x-data-readiness: derived
        outcomes_shared:
          type: boolean
          description: >-
            Whether this learner has opted in to sharing their course status.
            False means every field below is null.
          x-data-readiness: pending-model
        outcomes_consent_on:
          type: [string, 'null']
          format: date-time
          description: When consent was recorded. Null when `outcomes_shared` is false.
          x-data-readiness: pending-model
        last_active_on:
          type: [string, 'null']
          format: date
          description: Most recent day with recorded course activity. A date, not a timestamp — activity is aggregated per day.
          x-data-readiness: pending-model
        courses_in_progress:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: pending-model
        courses_passed:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: derived
        courses_certified:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: derived
        certificates_earned:
          type: [integer, 'null']
          minimum: 0
          description: Includes program certificates, which have no course run and so are not in `courses_certified`.
          x-data-readiness: derived

    Enrollment:
      type: object
      description: >-
        One learner's enrollment in one course run, attributed to one of the
        organization's contracts. Fields below `outcomes_shared` are null
        unless it is true.
      required:
        - learner_id
        - email
        - full_name
        - organization_id
        - contract_id
        - contract_name
        - courserun_id
        - courserun_title
        - courserun_start_on
        - courserun_end_on
        - enrolled_on
        - enrollment_is_active
        - enrollment_mode
        - enrollment_status
        - outcomes_shared
        - completion_status
        - is_passing
        - grade
        - letter_grade
        - certificate_issued_on
        - certificate_is_revoked
        - last_active_on
        - days_active
        - videos_watched
        - problems_attempted
        - chatbot_interactions
      properties:
        learner_id:
          type: string
          format: uuid
          x-data-readiness: available
        email:
          type: [string, 'null']
          format: email
          x-data-readiness: available
        full_name:
          type: [string, 'null']
          description: Often null.
          x-data-readiness: available
        organization_id:
          type: string
          format: uuid
          x-data-readiness: available
        contract_id:
          type: integer
          format: int64
          x-data-readiness: available
        contract_name:
          type: string
          x-data-readiness: available
        courserun_id:
          type: string
          description: 'Readable course-run identifier, e.g. `course-v1:MITxT+14.310x+2T2026`.'
          x-data-readiness: available
        courserun_title:
          type: string
          description: Mutable display title — key on `courserun_id`.
          x-data-readiness: available
        courserun_start_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        courserun_end_on:
          type: [string, 'null']
          format: date-time
          description: Null for self-paced runs.
          x-data-readiness: available
        enrolled_on:
          type: string
          format: date-time
          description: This run's enrollment, not an earlier run of the same course. Not consent-gated.
          x-data-readiness: available
        enrollment_is_active:
          type: boolean
          description: Not consent-gated.
          x-data-readiness: available
        enrollment_mode:
          type: [string, 'null']
          description: 'e.g. `verified`, `audit`. Determines whether the run is certificate-bearing.'
          x-data-readiness: available
        enrollment_status:
          type: [string, 'null']
          description: Deactivation reason where one was recorded.
          x-data-readiness: available
        outcomes_shared:
          type: boolean
          description: Whether the learner has opted in to sharing their course status. False means every field below is null.
          x-data-readiness: pending-model
        completion_status:
          oneOf:
            - $ref: '#/components/schemas/CompletionStatus'
            - type: 'null'
          description: Single derived answer per row. Null when outcomes are withheld.
          x-data-readiness: derived
        is_passing:
          type: [boolean, 'null']
          description: Null where no grade has been computed.
          x-data-readiness: available
        grade:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 1
          x-data-readiness: available
        letter_grade:
          type: [string, 'null']
          description: Frequently null — not every platform records one.
          x-data-readiness: available
        certificate_issued_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        certificate_is_revoked:
          type: [boolean, 'null']
          description: Null where no certificate exists. A revoked certificate leaves `completion_status` at `passed`.
          x-data-readiness: available
        last_active_on:
          type: [string, 'null']
          format: date
          description: Most recent day with recorded activity in this course run.
          x-data-readiness: pending-model
        days_active:
          type: [integer, 'null']
          minimum: 0
          description: Distinct days with recorded activity in this course run.
          x-data-readiness: pending-model
        videos_watched:
          type: [integer, 'null']
          minimum: 0
          description: Distinct video blocks played.
          x-data-readiness: pending-model
        problems_attempted:
          type: [integer, 'null']
          minimum: 0
          description: Distinct problem blocks attempted.
          x-data-readiness: pending-model
        chatbot_interactions:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: pending-model

    CourseRun:
      type: object
      description: One course run covered by one of the organization's contracts. No personal data.
      required:
        - organization_id
        - organization_name
        - contract_id
        - contract_name
        - contract_is_active
        - contract_start_date
        - contract_end_date
        - seat_limit
        - courserun_id
        - courserun_title
        - courserun_start_on
        - courserun_end_on
      properties:
        organization_id: { type: string, format: uuid, x-data-readiness: available }
        organization_name: { type: string, x-data-readiness: available }
        contract_id: { type: integer, format: int64, x-data-readiness: available }
        contract_name: { type: string, x-data-readiness: available }
        contract_is_active: { type: boolean, x-data-readiness: available }
        contract_start_date:
          type: [string, 'null']
          format: date
          x-data-readiness: available
        contract_end_date:
          type: [string, 'null']
          format: date
          x-data-readiness: available
        seat_limit:
          type: [integer, 'null']
          minimum: 0
          description: Null means uncapped, not zero.
          x-data-readiness: available
        courserun_id: { type: string, x-data-readiness: available }
        courserun_title: { type: string, x-data-readiness: available }
        courserun_start_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        courserun_end_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available

    ExportFile:
      type: object
      description: One bulk-export file. Contents use this API's record schemas.
      required: [collection, as_of, format, record_count, size_bytes, checksum_sha256, uri, expires_on]
      properties:
        collection:
          type: string
          enum: [learners, enrollments, courses]
        as_of:
          type: string
          format: date-time
          description: The refresh this file was written from.
        format:
          type: string
          enum: [jsonl, csv, parquet]
        record_count:
          type: integer
          minimum: 0
        size_bytes:
          type: [integer, 'null']
          minimum: 0
        checksum_sha256:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        uri:
          type: string
          format: uri
          description: '`s3://` or `sftp://` location, readable with the credentials issued alongside the API client.'
        expires_on:
          type: string
          format: date-time
          description: After this, the file is deleted and must be re-fetched from a newer refresh.

    MembershipSource:
      type: string
      description: >-
        `roster` = on the organization's membership roster with no enrollments
        (an assigned, unstarted seat). `enrollment` = enrolled under a contract
        but absent from the roster (usually a provisioning lag). `both` = the
        expected state.
      enum: [roster, enrollment, both]
      x-data-readiness: available

    CompletionStatus:
      type: string
      description: >-
        `passed` without `certified` is normal — certificates are issued on a
        schedule after grading, and audit-mode enrollments never certify.
      enum: [not_started, in_progress, passed, certified]
      x-data-readiness: derived

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

  responses:

    BadRequest:
      description: Malformed parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: 'limit must be between 1 and 1000' }

    Unauthorized:
      description: Missing, malformed or expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: 'Invalid or expired access token' }

    Forbidden:
      description: >-
        Token valid but lacks a grant for this organization, or lacks the
        required scope. Identical whether the organization is ungranted or does
        not exist, so this cannot be used to enumerate organizations.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: 'No grant for the requested organization' }

    TooManyRequests:
      description: Per-client rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: 'Rate limit exceeded' }

    ServiceUnavailable:
      description: Analytics store unreachable or saturated.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: 'Analytics store unavailable' }
