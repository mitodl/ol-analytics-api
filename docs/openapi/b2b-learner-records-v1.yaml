                        uri: https://ol-b2b-exports.s3.amazonaws.com/8f14e45f/2026-08-13T06-15-00Z/enrollments.jsonl.gz?X-Amz-Expires=900&X-Amz-Signature=…
                        uri_expires_on: '2026-08-13T09:30:00Z'
                        expires_on: '2026-09-12T06:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:

  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: >-
        Keycloak client credentials. The token's signature, issuer, audience
        and lifetime are verified by the service itself, not only at the
        gateway. One client is issued per contracted integration and lists the
        organizations it may read, every contract under each included. Scopes
        bound to a client are a contractual limit on that credential; they are
        not the consent mechanism.
      flows:
        clientCredentials:
          tokenUrl: https://sso.ol.mit.edu/realms/olapps/protocol/openid-connect/token
          scopes:
            learner-records:read: Read records, identity fields included.

  parameters:

    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: The organization's Keycloak organization UUID. Slugs and names are not accepted.
      schema: { type: string, format: uuid }
      example: 8f14e45f-ceea-467a-9c1b-2f4b9c0a3d21

    ContractId:
      name: contract_id
      in: query
      required: false
      description: >-
        Narrows the result to one of the organization's contracts. A filter,
        not an access boundary: a client reads every contract under the
        organizations it lists. A contract not under the path's organization
        matches nothing and returns an empty page, not a 403; the result is the
        same whether the contract belongs to another organization or doesn't
        exist.
      schema: { type: integer, format: int64 }
      example: 42

    CourseRunId:
      name: courserun_id
      in: query
      required: false
      schema: { type: string }
      example: course-v1:MITxT+14.310x+2T2026

    LearnerId:
      name: learner_id
      in: query
      required: false
      description: Repeat for several; maximum 100 per request.
      schema:
        type: array
        maxItems: 100
        items: { type: string, format: uuid }
      style: form
      explode: true

    CompletionStatusFilter:
      name: completion_status
      in: query
      required: false
      description: >-
        Repeat for several. Matches only records with shared outcomes; pass
        `unknown` to select records whose outcomes are withheld.
      schema:
        type: array
        items:
          type: string
          enum: [not_started, in_progress, passed, certified, unknown]
      style: form
      explode: true

    UpdatedSince:
      name: updated_since
      in: query
      required: false
      description: >-
        Return only records changed at or after this instant. Pass the previous
        sync's `as_of`. A record's change time is the latest of its enrollment,
        grade, certificate, organization membership and (once it exists)
        consent changes. Activity doesn't move it. Deactivated enrollments and
        learners no longer in the organization are changes too, but
        `include_inactive` still filters them, so pass
        `include_inactive=true` when syncing.
      schema: { type: string, format: date-time }
      example: '2026-08-12T06:15:00Z'

    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: >-
        On `/enrollments`, includes deactivated enrollments (unenrolled,
        refunded, transferred). On `/learners`: rollups count deactivated
        enrollments too; learners whose only enrollments are deactivated are
        included; learners with `is_current: false` are included; and a roster
        member whose only enrollment is deactivated reads
        `membership_source: both` rather than `roster`. Roster members with no
        enrollments at all are included either way.
      schema: { type: boolean, default: false }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }

    Offset:
      name: offset
      in: query
      required: false
      description: >-
        Stable only within one refresh. If the envelope's `as_of` differs from
        the previous page's, restart from 0; otherwise rows can be skipped or
        repeated.
      schema: { type: integer, minimum: 0, default: 0 }

  schemas:

    OrganizationEnvelope:
      type: object
      description: Shared response envelope; `data` is typed per endpoint.
      required: [organization_id, as_of, total_count, outcomes_withheld_count, data]
      properties:
        organization_id:
          type: string
          format: uuid
        as_of:
          type: [string, 'null']
          format: date-time
          description: Last refresh of the backing data. Null before an organization's first refresh.
        total_count:
          type: integer
          minimum: 0
          description: Matching records across all pages, not this page.
        outcomes_withheld_count:
          type: integer
          minimum: 0
          description: >-
            Records in `total_count` carrying `outcomes_shared: false`. Always 0
            on `/courses` and `/exports`.
        data:
          type: array
          items: {}

    Learner:
      type: object
      description: >-
        One learner's association with the organization. Fields below
        `outcomes_shared` are null unless it is true.
      required:
        - learner_id
        - email
        - full_name
        - organization_id
        - organization_name
        - membership_source
        - is_current
        - is_organization_manager
        - first_enrolled_on
        - last_enrolled_on
        - courses_enrolled
        - outcomes_shared
        - outcomes_consent_on
        - last_active_on
        - courses_in_progress
        - courses_passed
        - courses_certified
        - certificates_earned
      properties:
        learner_id:
          type: string
          format: uuid
          description: Stable opaque identifier, consistent across endpoints and stable across email changes. Use as the join key.
          x-data-readiness: available
        email:
          type: [string, 'null']
          format: email
          description: Not a join key; may differ from the enrolling address.
          x-data-readiness: available
        full_name:
          type: [string, 'null']
          description: Often null.
          x-data-readiness: available
        organization_id:
          type: string
          format: uuid
          x-data-readiness: available
        organization_name:
          type: string
          x-data-readiness: available
        membership_source:
          $ref: '#/components/schemas/MembershipSource'
        is_current:
          type: boolean
          description: >-
            False once the learner is no longer associated with the
            organization: off the roster and holding no enrollment under its
            contracts. The record stays so a syncing client learns of the
            removal; it is returned only with `include_inactive=true`.
            Identity is still populated. Erasure requests are handled
            separately and not yet specified.
          x-data-readiness: pending-model
        is_organization_manager:
          type: boolean
          description: Administers the organization in MITx Online.
          x-data-readiness: available
        first_enrolled_on:
          type: [string, 'null']
          format: date-time
          description: Null for a roster member with no enrollments.
          x-data-readiness: available
        last_enrolled_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        courses_enrolled:
          type: integer
          minimum: 0
          description: Distinct course runs under the organization's contracts. Not consent-gated.
          x-data-readiness: derived
        outcomes_shared:
          type: boolean
          description: >-
            Whether this learner has opted in to sharing their course status.
            False means every field below is null.
          x-data-readiness: pending-model
        outcomes_consent_on:
          type: [string, 'null']
          format: date-time
          description: When consent was recorded. Null when `outcomes_shared` is false.
          x-data-readiness: pending-model
        last_active_on:
          type: [string, 'null']
          format: date
          description: Most recent day with recorded course activity. A date, not a timestamp — activity is aggregated per day. Changes to it do not move `updated_since`; a full reload picks them up.
          x-data-readiness: pending-model
        courses_in_progress:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: pending-model
        courses_passed:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: derived
        courses_certified:
          type: [integer, 'null']
          minimum: 0
          x-data-readiness: derived
        certificates_earned:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Includes program certificates, which have no course run and so are
            not in `courses_certified`. This is the only program-level figure in
            v1; program progress is otherwise out of scope, so nothing else in
            the payload reconciles against it. With `contract_id`, program
            certificates belong to no single contract and are excluded.
          x-data-readiness: derived

    Enrollment:
      type: object
      description: >-
        One learner's enrollment in one course run, attributed to one of the
        organization's contracts. Fields below `outcomes_shared` are null
        unless it is true.
      required:
        - learner_id
        - email
        - full_name
        - organization_id
        - contract_id
        - contract_name
        - courserun_id
        - courserun_title
        - courserun_start_on
        - courserun_end_on
        - enrolled_on
        - enrollment_is_active
        - enrollment_mode
        - enrollment_status
        - outcomes_shared
        - completion_status
        - is_passing
        - grade
        - letter_grade
        - certificate_issued_on
        - certificate_is_revoked
        - last_active_on
        - days_active
        - videos_watched
        - problems_attempted
        - chatbot_interactions
      properties:
        learner_id:
          type: string
          format: uuid
          x-data-readiness: available
        email:
          type: [string, 'null']
          format: email
          x-data-readiness: available
        full_name:
          type: [string, 'null']
          description: Often null.
          x-data-readiness: available
        organization_id:
          type: string
          format: uuid
          x-data-readiness: available
        contract_id:
          type: integer
          format: int64
          x-data-readiness: available
        contract_name:
          type: string
          x-data-readiness: available
        courserun_id:
          type: string
          description: 'Readable course-run identifier, e.g. `course-v1:MITxT+14.310x+2T2026`.'
          x-data-readiness: available
        courserun_title:
          type: string
          description: Mutable display title — key on `courserun_id`.
          x-data-readiness: available
        courserun_start_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        courserun_end_on:
          type: [string, 'null']
          format: date-time
          description: Null for self-paced runs.
          x-data-readiness: available
        enrolled_on:
          type: string
          format: date-time
          description: This run's enrollment, not an earlier run of the same course. Not consent-gated.
          x-data-readiness: available
        enrollment_is_active:
          type: boolean
          description: Not consent-gated.
          x-data-readiness: available
        enrollment_mode:
          type: [string, 'null']
          description: 'e.g. `verified`, `audit`. Determines whether the run is certificate-bearing.'
          x-data-readiness: available
        enrollment_status:
          type: [string, 'null']
          description: Deactivation reason where one was recorded.
          x-data-readiness: available
        outcomes_shared:
          type: boolean
          description: Whether the learner has opted in to sharing their course status. False means every field below is null.
          x-data-readiness: pending-model
        completion_status:
          oneOf:
            - $ref: '#/components/schemas/CompletionStatus'
            - type: 'null'
          description: Single derived answer per row. Null when outcomes are withheld.
          x-data-readiness: derived
        is_passing:
          type: [boolean, 'null']
          description: Null where no grade has been computed.
          x-data-readiness: available
        grade:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 1
          x-data-readiness: available
        letter_grade:
          type: [string, 'null']
          description: Frequently null — not every platform records one.
          x-data-readiness: available
        certificate_issued_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        certificate_is_revoked:
          type: [boolean, 'null']
          description: >-
            Null where no certificate exists. A revoked certificate doesn't
            count as certified: `completion_status` then follows the grade, so
            it can read `passed`, `in_progress` or `not_started`.
          x-data-readiness: available
        last_active_on:
          type: [string, 'null']
          format: date
          description: Most recent day with recorded activity in this course run. Changes to it do not move `updated_since`; a full reload picks them up.
          x-data-readiness: pending-model
        days_active:
          type: [integer, 'null']
          minimum: 0
          description: Distinct days with recorded activity in this course run. Changes to it do not move `updated_since`; a full reload picks them up.
          x-data-readiness: pending-model
        videos_watched:
          type: [integer, 'null']
          minimum: 0
          description: Distinct video blocks played. Changes to it do not move `updated_since`; a full reload picks them up.
          x-data-readiness: pending-model
        problems_attempted:
          type: [integer, 'null']
          minimum: 0
          description: Distinct problem blocks attempted. Changes to it do not move `updated_since`; a full reload picks them up.
          x-data-readiness: pending-model
        chatbot_interactions:
          type: [integer, 'null']
          minimum: 0
          description: Changes to it do not move `updated_since`; a full reload picks them up.
          x-data-readiness: pending-model

    CourseRun:
      type: object
      description: One course run covered by one of the organization's contracts. No personal data.
      required:
        - organization_id
        - organization_name
        - contract_id
        - contract_name
        - contract_is_active
        - contract_start_date
        - contract_end_date
        - seat_limit
        - courserun_id
        - courserun_title
        - courserun_start_on
        - courserun_end_on
      properties:
        organization_id: { type: string, format: uuid, x-data-readiness: available }
        organization_name: { type: string, x-data-readiness: available }
        contract_id: { type: integer, format: int64, x-data-readiness: available }
        contract_name: { type: string, x-data-readiness: available }
        contract_is_active: { type: boolean, x-data-readiness: available }
        contract_start_date:
          type: [string, 'null']
          format: date
          x-data-readiness: available
        contract_end_date:
          type: [string, 'null']
          format: date
          x-data-readiness: available
        seat_limit:
          type: [integer, 'null']
          minimum: 0
          description: Null means uncapped, not zero.
          x-data-readiness: available
        courserun_id: { type: string, x-data-readiness: available }
        courserun_title: { type: string, x-data-readiness: available }
        courserun_start_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available
        courserun_end_on:
          type: [string, 'null']
          format: date-time
          x-data-readiness: available

    ExportFile:
      type: object
      description: One bulk-export file. Contents use this API's record schemas.
      required: [collection, as_of, format, record_count, size_bytes, checksum_sha256, uri, uri_expires_on, expires_on]
      properties:
        collection:
          type: string
          enum: [learners, enrollments, courses]
        as_of:
          type: string
          format: date-time
          description: The refresh this file was written from.
        format:
          type: string
          description: >-
            In `csv`, null is an empty unquoted field and an empty string is
            `""`. `jsonl` and `parquet` carry null natively.
          enum: [jsonl, csv, parquet]
        record_count:
          type: integer
          minimum: 0
        size_bytes:
          type: [integer, 'null']
          minimum: 0
        checksum_sha256:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        uri:
          type: string
          format: uri
          description: >-
            Presigned HTTPS URL for the file. Needs no credential beyond itself;
            valid until `uri_expires_on`. List the manifest again for a fresh
            URL.
        uri_expires_on:
          type: string
          format: date-time
          description: When `uri` stops working. The file itself remains until `expires_on`.
        expires_on:
          type: string
          format: date-time
          description: >-
            File retention. After this, the file is deleted and must be
            re-fetched from a newer refresh.

    MembershipSource:
      type: string
      description: >-
        `roster` = on the organization's membership roster with no enrollments
        (an assigned, unstarted seat). `enrollment` = enrolled under a contract
        but absent from the roster (usually a provisioning lag). `both` = the
        expected state.
      enum: [roster, enrollment, both]
      x-data-readiness: available

    CompletionStatus:
      type: string
      description: >-
        `passed` without `certified` is normal — certificates are issued on a
        schedule after grading, and audit-mode enrollments never certify.
      enum: [not_started, in_progress, passed, certified]
      x-data-readiness: derived

    Error:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable reason. Branch on this, not on `detail`,
            whose wording may change.
          enum:
            - invalid_parameter
            - unauthorized
            - missing_scope
            - no_organization_access
            - rate_limited
            - unavailable
        detail:
          type: string
          description: Human-readable explanation.

  responses:

    BadRequest:
      description: >-
        Malformed parameter, including a non-UUID `organization_id` in the path.
        Deliberately 400, not FastAPI's default 422: the service normalizes
        validation errors to this body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: invalid_parameter, detail: 'limit: Input should be less than or equal to 1000' }

    Unauthorized:
      description: >-
        No token, or one that failed verification: bad signature, unknown
        signing key, wrong issuer or audience, or outside its validity window.
        The body does not say which, so it cannot be used to probe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, detail: 'Invalid or missing bearer token' }

    Forbidden:
      description: >-
        Token valid but lacks access to this organization
        (`no_organization_access`) or lacks the required scope
        (`missing_scope`). Identical whether the client lacks access or the
        organization does not exist, so this cannot be used to enumerate
        organizations.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: no_organization_access, detail: 'No access to the requested organization' }

    TooManyRequests:
      description: Per-client rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: rate_limited, detail: 'Rate limit exceeded' }

    ServiceUnavailable:
      description: Analytics store unreachable or saturated.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unavailable, detail: 'Analytics store unavailable' }
