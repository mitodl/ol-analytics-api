  /organizations/{organization_id}/exports:
    get:
      tags: [exports]
      operationId: listExports
      summary: Bulk export files available for this organization
      description: >-
        Manifest of the bulk exports, one set per collection per refresh, each
        with a short-lived presigned HTTPS URL. A batch job writes the files to
        S3 outside this API; the same files are also readable through a
        cross-account IAM role limited to the organization's prefix, or over
        SFTP. This endpoint is the path that needs no credential beyond the API
        client. Records inside carry the same schemas as this API, identity
        fields included. Ordered by `as_of` descending, then `collection` and
        `format`, which is unique.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of export manifest entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ExportFile' }
              examples:
                default:
